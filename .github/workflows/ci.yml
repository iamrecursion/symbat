name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the run in flight redundant. Cancel it, except on
# main, where the run for each commit is the record that that commit was green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Formatting is checked on its own, without Nix and without a toolchain, so a
  # 101-character Markdown line costs fifteen seconds rather than a full build.
  # Everything else runs inside the flake devshell.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version the devshell provides, so `make format` locally
      # produces exactly what this job accepts. nix.yml asserts the two agree;
      # when nixpkgs moves dprint, that check is what tells you to bump this.
      - uses: dprint/check@v2.3
        with:
          dprint-version: "0.55.2"

  # What Obsidian's plugin review actually runs: a clean checkout, plain npm,
  # and `npm run build`. No Nix, no Rust, no Xonsh — so this fails if anything
  # ever puts the wasm toolchain back on the path a packager has to walk. The
  # 1.0.0 submission was flagged for exactly that, and nothing in the Nix-based
  # job below could have caught it, because the devshell supplies every tool the
  # reviewer lacks.
  clean-build:
    name: Build without the devshell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Assert a bundle was produced
        run: |
          if [ ! -s main.js ]; then
            echo "::error::npm run build produced no main.js"
            exit 1
          fi
          echo "main.js is $(( $(stat -c%s main.js) / 1024 )) KiB."

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The devshell is this project's only description of its toolchain, and
      # every step below runs inside it via the same `make` targets a
      # contributor uses. A devshell that builds locally cannot silently fail
      # here, because there is no second toolchain to drift from it.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Everything below keys off the pinned Numbat tag, so read it from the one
      # place it is written rather than repeating it here.
      - name: Read the pinned Numbat tag
        id: numbat
        run: |
          tag=$(sed -n 's/^NUMBAT_TAG = "\(.*\)"$/\1/p' scripts/build-wasm.xsh)
          if [ -z "$tag" ]; then
            echo "::error file=scripts/build-wasm.xsh::could not read NUMBAT_TAG"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Numbat $tag"

      - name: Cache the npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: make deps

      # build-wasm.xsh makes this same comparison and skips itself when it holds,
      # but it does so *after* the Rust cache would have been restored — and that
      # restore is hundreds of megabytes fetched for a step that then does
      # nothing. Asking the stamp here, where it costs a `cat`, is what keeps the
      # common case cheap.
      - name: Decide whether the bindings need rebuilding
        id: bindings
        run: |
          stamped=$(cat src/wasm/pkg/.numbat-tag 2>/dev/null || echo none)
          if [ "$stamped" = "${{ steps.numbat.outputs.tag }}" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Bindings are stamped $stamped; no Rust build needed."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Bindings are stamped $stamped but the pin is ${{ steps.numbat.outputs.tag }}."
          fi

      # Only reached when the pin has moved. `restore-keys` means even then it
      # starts from the previous run's registry and target directory, so it costs
      # minutes rather than a cold build of the dependency graph.
      - name: Cache the Rust build
        if: steps.bindings.outputs.stale == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/numbat/numbat-wasm/target
          key: cargo-${{ runner.os }}-${{ steps.numbat.outputs.tag }}
          restore-keys: cargo-${{ runner.os }}-

      # Produces the bindings the commit should have carried, so the assertion
      # below can report exactly what is missing. Skipped entirely in the common
      # case, which is also why bit-reproducibility never comes into it: nothing
      # is rebuilt, so nothing is compared.
      - name: Rebuild the wasm bindings if the pinned tag moved
        if: steps.bindings.outputs.stale == 'true'
        run: make wasm

      # `git status`, not `git diff`: a future wasm-bindgen emitting a file under
      # a new name would leave it untracked, which a diff cannot see.
      - name: Assert the committed bindings match the pinned tag
        run: |
          if [ -n "$(git status --porcelain -- src/wasm/pkg)" ]; then
            echo "::error::src/wasm/pkg is stale for Numbat ${{ steps.numbat.outputs.tag }}."
            echo "::error::Run 'make wasm' and commit the regenerated bindings."
            git status --short -- src/wasm/pkg
            exit 1
          fi

      # An incomplete directory would otherwise surface as a confusing type
      # error several minutes later. The integration suite makes the same
      # assertion at module load whenever CI is set, so a green run cannot mean
      # "the tests were skipped".
      - name: Assert the bindings are present
        run: |
          for file in numbat_wasm.js numbat_wasm.d.ts numbat_wasm_bg.wasm; do
            if [ ! -s "src/wasm/pkg/$file" ]; then
              echo "::error::src/wasm/pkg/$file is missing or empty"
              exit 1
            fi
          done

      - name: Type-check
        run: make typecheck

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

      - name: Bundle
        run: make build

      - name: Report the bundle size
        run: |
          bundle=$(stat -c%s main.js)
          wasm=$(stat -c%s src/wasm/pkg/numbat_wasm_bg.wasm)
          {
            echo "### Build"
            echo
            echo "| Artifact | Size |"
            echo "| --- | ---: |"
            echo "| \`main.js\` | $((bundle / 1024)) KiB |"
            echo "| \`numbat_wasm_bg.wasm\` (inlined above) | $((wasm / 1024)) KiB |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The three files Obsidian installs, so a reviewer can drop this build
      # straight into a vault without building it themselves.
      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: symbat-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
