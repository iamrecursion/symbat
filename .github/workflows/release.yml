name: Release

# Obsidian finds a plugin release by looking for a git tag identical to
# manifest.json's `version` — `1.0.0`, never `v1.0.0`. This filter therefore
# matches bare semver only; `.npmrc` sets `tag-version-prefix=` so that `npm
# version` produces such a tag, and the first job step re-checks it anyway.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # create the release and upload its assets
  id-token: write # \_ build provenance attestation for the release assets
  attestations: write # /

jobs:
  release:
    name: Build and draft the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Everything a mistagged release breaks is invisible until a user reports
      # that the plugin will not install, so check every part of the contract
      # before spending ten minutes on a build.
      - name: Validate the tag against the manifest
        run: |
          tag="$GITHUB_REF_NAME"
          fail=0
          note() {
            echo "::error::$1"
            fail=1
          }

          case "$tag" in
            v*) note "the tag is '$tag'; Obsidian requires a bare version with no 'v' prefix" ;;
          esac

          # node, rather than jq: it is the runtime the rest of this build uses,
          # and `--eval` is CommonJS regardless of package.json's "type".
          manifest_version=$(node -p "require('./manifest.json').version")
          min_app_version=$(node -p "require('./manifest.json').minAppVersion")
          package_version=$(node -p "require('./package.json').version")
          versions_entry=$(node -p "require('./versions.json')[process.argv[1]] ?? ''" "$tag")

          [ "$manifest_version" = "$tag" ] \
            || note "manifest.json says version $manifest_version, but the tag is $tag"
          [ "$package_version" = "$tag" ] \
            || note "package.json says version $package_version, but the tag is $tag"

          if [ -z "$versions_entry" ]; then
            note "versions.json has no entry for $tag; Obsidian uses it to decide which release an older app should download"
          elif [ "$versions_entry" != "$min_app_version" ]; then
            note "versions.json maps $tag to $versions_entry, but manifest.json's minAppVersion is $min_app_version"
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "$tag — minAppVersion $min_app_version"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Restore only. A tag push can read caches from the default branch, so CI
      # has already warmed these; a release should not evict anything.
      - name: Restore the Nix store cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # This job deliberately does NOT rebuild the wasm. Obsidian's plugin review
      # builds the tagged source with `npm ci && npm run build` and compares the
      # result against the released main.js, so the bundle that ships has to be
      # the one a clean checkout produces — which means inlining the committed
      # bindings byte for byte.
      #
      # Rebuilding here instead was the original design, on the grounds that a
      # release should compile from pinned source rather than ship what somebody
      # committed. It cannot do both: the numbat wasm build is not reproducible.
      # Two builds of the same tag, on the same machine, in this same devshell,
      # differ by a few hundred bytes of data-segment layout — same strings, same
      # behaviour, different bytes. So a rebuilt release could never match a
      # clean-checkout build, and 1.0.1 was flagged for exactly that.
      #
      # What is left is the better guarantee of the two, because it is the one
      # anybody can check: the released main.js is what this repository at this
      # tag builds. The bindings' own provenance is held up by the stamp assert
      # below, by CI failing when they do not carry the pinned tag, and by
      # build-wasm.xsh being the only thing that writes them.
      - name: Assert the committed bindings carry the pinned tag
        run: |
          pinned=$(sed -n 's/^NUMBAT_TAG = "\(.*\)"$/\1/p' scripts/build-wasm.xsh)
          if [ -z "$pinned" ]; then
            echo "::error file=scripts/build-wasm.xsh::could not read NUMBAT_TAG"
            exit 1
          fi

          stamped=$(cat src/wasm/pkg/.numbat-tag 2>/dev/null || echo none)
          if [ "$stamped" != "$pinned" ]; then
            echo "::error::src/wasm/pkg is stamped $stamped but NUMBAT_TAG is $pinned."
            echo "::error::A release ships these bytes as-is. Run 'rm -rf src/wasm/pkg && make wasm', commit, and re-tag."
            exit 1
          fi

          for file in numbat_wasm.js numbat_wasm.d.ts numbat_wasm_bg.wasm; do
            if [ ! -s "src/wasm/pkg/$file" ]; then
              echo "::error::src/wasm/pkg/$file is missing or empty"
              exit 1
            fi
          done

          echo "Bindings are Numbat $pinned, $(( $(stat -c%s src/wasm/pkg/numbat_wasm_bg.wasm) / 1024 )) KiB."

      - name: Install dependencies
        run: make deps

      - name: Check
        run: make check

      - name: Bundle
        run: make build

      # All three assets, not just the bundle: attestation proves an asset came
      # from this repository's workflow, and an unattested one is exactly where a
      # substitution would go unnoticed. styles.css is loaded into every note's
      # DOM and manifest.json decides what Obsidian trusts the plugin to be, so
      # neither is inert.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Obsidian downloads main.js, manifest.json and styles.css as individual
      # release assets; it does not look inside the source archive GitHub
      # attaches automatically. Draft, so the release is reviewed before it
      # exists as far as Obsidian is concerned — only published releases are
      # visible to it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css

      - name: Summarize
        run: |
          {
            echo "### $GITHUB_REF_NAME drafted"
            echo
            echo "\`main.js\` is $(( $(stat -c%s main.js) / 1024 )) KiB."
            echo
            echo "Review the draft and publish it — Obsidian only sees published releases."
          } >> "$GITHUB_STEP_SUMMARY"
